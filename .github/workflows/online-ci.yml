name: Validate C2 Maçka persistent pilot multiplayer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/game-backend/src/**'
      - 'apps/game-backend/sql/**'
      - 'maps/macka-online-client.js'
      - 'maps/macka-viewer.js'
      - 'maps/macka.html'
      - 'tests/online-macka.test.ts'
      - 'tests/pilot-match.test.ts'
      - 'tests/frontline-room.test.ts'
      - 'tests/smoke-online-macka.mjs'
      - 'tests/smoke-online-pilot.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/online-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pbn-online-macka-a3-guest-auth
  cancel-in-progress: true

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paintball_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paintball_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/paintball_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Typecheck world and online server
        run: npm run world:check
      - name: Build browser Colyseus client
        run: npm run online:build
      - name: Initialize pilot and persistent world tables
        run: npm run world:migrate
      - name: Test real guest and pilot SDK connections and server authority
        run: timeout --signal=TERM --kill-after=5s 70s npm run online:test
      - name: Install lightweight browser automation
        run: npm install --no-save playwright
      - name: Test 2 real PlayCanvas browser clients locally
        run: |
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pbn-web.log 2>&1 &
          NODE_ENV=test npm run online:serve > /tmp/pbn-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s --max-time 1 -o /dev/null http://127.0.0.1:2567/; then break; fi
            sleep 1
          done
          node tests/smoke-online-macka.mjs
          node tests/smoke-online-pilot.mjs
      - name: Print local test server diagnostics on failure
        if: failure()
        run: |
          echo "---- Local Colyseus server diagnostics ----"
          tail -n 50 /tmp/pbn-server.log || true
          echo "---- Local static HTTP diagnostics ----"
          tail -n 25 /tmp/pbn-web.log || true
      - name: Commit browser bundle after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/macka-online.bundle.js
          if ! git diff --cached --quiet; then
            git commit -m "Build tested Maçka multiplayer browser bundle [skip ci]"
            git push origin HEAD:main
          fi
