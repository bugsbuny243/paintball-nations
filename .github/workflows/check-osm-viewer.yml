name: Validate real OSM map viewer

on:
  push:
    branches: [main]
    paths:
      - maps/macka-paintball.js
      - tests/smoke-macka.mjs
      - maps/macka-viewer.js
      - maps/macka.html
      - maps/istanbul-macka.json
      - .github/workflows/check-osm-viewer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-macka-3d-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check maps/macka-viewer.js
          node --check maps/macka-paintball.js
          node --check tests/smoke-macka.mjs
      - name: Verify actual OSM-derived data, counts and attribution
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('maps/istanbul-macka.json').read_text(encoding='utf8'))
          assert d['metadata']['license']=='ODbL-1.0'
          assert d['metadata']['attribution']=='© OpenStreetMap contributors'
          assert len(d['roads'])>=20 and len(d['buildings'])>=1
          assert len(d['roads'])==d['metadata']['counts']['roads']
          assert len(d['buildings'])==d['metadata']['counts']['buildings']
          assert len(d['greenAreas'])==d['metadata']['counts']['greenAreas']
          for category in ('roads','buildings','greenAreas'):
              for obj in d[category]:
                  assert isinstance(obj['p'],list) and all(len(p)==2 for p in obj['p'])
          print('OSM viewer data validated', d['metadata']['counts'])
          PY
      - name: Check linked page scripts and map paths
        run: |
          grep -F 'playcanvas@2.24.1' maps/macka.html
          grep -F 'macka-viewer.js' maps/macka.html
          grep -F 'istanbul-macka.json' maps/macka-viewer.js
          grep -F 'macka-paintball.js' maps/macka.html
          grep -F 'macka.html?play=1' index.html
      - name: Install small browser automation dependency
        run: npm install --no-save playwright
      - name: Smoke-test paintball map using GitHub runner Chrome
        run: |
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/paintball-http.log 2>&1 &
          sleep 2
          node tests/smoke-macka.mjs
