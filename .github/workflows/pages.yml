name: Publish mobile FPS demo

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Check playable HTML
        run: |
          test -f index.html
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload game build
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy game
        id: deploy
        uses: actions/deploy-pages@v4
